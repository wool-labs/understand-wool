name: CI

on:
  # Run on every PR so a contributor's first push gets feedback.
  pull_request:
  # Also run on direct pushes to main so the "main is green" signal is real.
  # Without this, main can silently break for days when someone bypasses
  # review. (#249)
  push:
    branches: [main]

# Cancel any in-flight CI for the same ref when a new commit is pushed —
# saves runner minutes and keeps the latest commit's status the only one
# anyone reads. `github.ref` is a controlled value (refs/heads/* or
# refs/pull/*/merge), not user-controlled input, so it's safe to interpolate.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # Linux only, deliberately. This project is developed and used on macOS,
    # and the Windows leg of the old matrix cost more than it caught — the
    # Python suites trip over CRLF translation in test fixtures, which would
    # make every future path- or newline-touching test a cross-platform
    # obligation for a platform with no users. (#3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-python@v6
        with:
          # The declared floor in pyproject.toml, tested exactly. Building on
          # the floor is what makes it meaningful: '3.x' would silently let a
          # 3.12-only construct through and break every developer still on the
          # minimum.
          python-version: '3.11'

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm lint

      - name: Build core
        run: pnpm --filter @understand-anything/core build

      - name: Build skill
        run: pnpm --filter @understand-anything/skill build

      - name: Build viewer
        run: pnpm --filter understand-anything-viewer build

      - name: Test core
        run: pnpm --filter @understand-anything/core test

      - name: Test skill
        run: pnpm test

      - name: Test Python skill helpers
        # pytest collects the pre-existing unittest.TestCase suites natively,
        # so this one invocation covers both styles.
        #
        # No path argument: an explicit path overrides testpaths, which is how
        # the integration suite ran nowhere for its first commit. pyproject.toml
        # decides what runs; this step only decides that it runs.
        #
        # pip is upgraded first because `--group` (PEP 735) needs 25.1+, and an
        # older pip does not fail on the flag so much as install nothing useful.
        run: |
          python -m pip install --upgrade 'pip>=25.1'
          python -m pip install --group dev
          pytest -v
